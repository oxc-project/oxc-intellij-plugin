[versions]
# libraries
junit = "4.13.2"
junit5 = "5.13.4"
kodein = "7.20.2"
coroutines = "1.10.1"

# plugins
changelog = "2.5.0"
intelliJPlatform = "2.19.0"
kotlin = "2.2.21"
kover = "0.9.4"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
junit5-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit5" }
junit5-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter" }
junit5-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
kodein = { group = "org.kodein.di", name = "kodein-di-jvm", version.ref = "kodein" }
coroutines = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core-jvm", version.ref = "coroutines" }

[plugins]
changelog = { id = "org.jetbrains.changelog", version.ref = "changelog" }
intelliJPlatform = { id = "org.jetbrains.intellij.platform", version.ref = "intelliJPlatform" }
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
