pluginGroup = com.github.oxc.project.oxcintellijplugin
pluginName = Oxc
pluginRepositoryUrl = https://github.com/oxc-project/oxc-intellij-plugin
# SemVer format -> https://semver.org
pluginVersion = 0.0.45

# Supported build number ranges -> https://plugins.jetbrains.com/docs/intellij/build-number-ranges.html
# There is deliberately no until-build: https://github.com/oxc-project/oxc-intellij-plugin/issues/231
pluginSinceBuild = 263

# The IDE to build and run against.
platformVersion = 2026.3

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

org.gradle.configuration-cache = true
org.gradle.caching = true
org.gradle.jvmargs = -Xmx4096m -XX:MaxMetaspaceSize=512m
