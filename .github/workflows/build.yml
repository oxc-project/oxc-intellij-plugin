permissions: { }

name: Build
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # TODO: Remove the check for nrayburn-tech.
  CACHE_READ_ONLY: >-
    ${{ !((github.repository == 'oxc-project/oxc-intellij-plugin' && github.ref == 'refs/heads/main')
    || (github.event.pull_request.head.repo.full_name || github.repository) == 'nrayburn-tech/oxc-intellij-plugin') }}
  # IntelliJ's archive is 1.5 GB and is just as easily downloaded fresh each time.
  GRADLE_CACHE_EXCLUDES: caches/modules-2/files-2.1/com.jetbrains.intellij.idea
  # Keep in sync with the project's Java toolchains.
  JAVA_TOOLCHAIN_DISTRO: jetbrains
  JAVA_TOOLCHAIN_VERSION: 25

jobs:

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch Sources
        uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: ${{ env.JAVA_TOOLCHAIN_DISTRO }}
          java-version: ${{ env.JAVA_TOOLCHAIN_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ env.CACHE_READ_ONLY }}
          gradle-home-cache-excludes: ${{ env.GRADLE_CACHE_EXCLUDES }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # The highlighting tests start the real language server from the fixture's node_modules.
      - name: Setup Oxlint Highlighting No Config Test
        working-directory: src/test/testData/oxlint/highlighting/no-config
        run: npm ci

      - name: Setup Oxfmt Formatting Test
        working-directory: src/test/testData/oxfmt/formatting/nested-config
        run: npm ci

      - name: Setup Vite+ Test
        working-directory: src/test/testData/viteplus/project
        run: npm ci

      # Yarn's release is committed in its fixture, and npx fetches pnpm and Bun, so each only needs Node.
      - name: Setup npm Workspace Test
        working-directory: src/test/testData/package-managers/npm
        run: npm ci

      - name: Setup Yarn Workspace Test
        working-directory: src/test/testData/package-managers/yarn
        run: node .yarn/releases/yarn-4.18.1.cjs install --immutable

      - name: Setup pnpm Workspace Test
        working-directory: src/test/testData/package-managers/pnpm
        run: npx -y pnpm@12.18.0 install --frozen-lockfile

      - name: Setup Bun Workspace Test
        working-directory: src/test/testData/package-managers/bun
        run: npx -y bun@1.3.14 install --frozen-lockfile

      # vp downloads each workspace's package manager on its first run, which outlasts the tests' waits.
      - name: Download Package Managers for Vite+
        run: node .github/scripts/download-vite-plus-package-managers.mjs

      - name: Run Tests
        run: ./gradlew check

      - name: Collect Tests Result
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-result
          include-hidden-files: true
          path: |
            ${{ github.workspace }}/build/test-results/test
            ${{ github.workspace }}/build/reports/tests
            ${{ github.workspace }}/.intellijPlatform/sandbox/*/*/log-test/language-services
            ${{ github.workspace }}/.intellijPlatform/sandbox/*/*/log-test/failed-tests

  # Runs the test suite as most Windows users run the plugin: without WSL. The WSL-only tests are skipped,
  # because no distribution is configured.
  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Fetch Sources
        uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: ${{ env.JAVA_TOOLCHAIN_DISTRO }}
          java-version: ${{ env.JAVA_TOOLCHAIN_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ env.CACHE_READ_ONLY }}
          gradle-home-cache-excludes: ${{ env.GRADLE_CACHE_EXCLUDES }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Setup Oxlint Highlighting No Config Test
        working-directory: src/test/testData/oxlint/highlighting/no-config
        run: npm ci

      - name: Setup Oxfmt Formatting Test
        working-directory: src/test/testData/oxfmt/formatting/nested-config
        run: npm ci

      - name: Setup Vite+ Test
        working-directory: src/test/testData/viteplus/project
        run: npm ci

      - name: Setup npm Workspace Test
        working-directory: src/test/testData/package-managers/npm
        run: npm ci

      - name: Setup Yarn Workspace Test
        working-directory: src/test/testData/package-managers/yarn
        run: node .yarn/releases/yarn-4.18.1.cjs install --immutable

      - name: Setup pnpm Workspace Test
        working-directory: src/test/testData/package-managers/pnpm
        run: npx -y pnpm@12.18.0 install --frozen-lockfile

      - name: Setup Bun Workspace Test
        working-directory: src/test/testData/package-managers/bun
        run: npx -y bun@1.3.14 install --frozen-lockfile

      - name: Download Package Managers for Vite+
        run: node .github/scripts/download-vite-plus-package-managers.mjs

      - name: Run Tests
        shell: bash
        run: ./gradlew test

      - name: Collect Tests Result
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-result-windows
          include-hidden-files: true
          path: |
            ${{ github.workspace }}/build/test-results/test
            ${{ github.workspace }}/build/reports/tests
            ${{ github.workspace }}/.intellijPlatform/sandbox/*/*/log-test/language-services
            ${{ github.workspace }}/.intellijPlatform/sandbox/*/*/log-test/failed-tests

  # Runs the test suite with Node.js in WSL, for a project on the Windows side and for one stored inside
  # WSL. Kept apart from the Windows job so that installing WSL neither changes nor slows down that run.
  test-wsl:
    name: Test (WSL, ${{ matrix.project }} project)
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: Windows
            tmpdir: ''
            viteplus: ''
            packagemanagers: ''
          - project: WSL
            tmpdir: '\\wsl.localhost\Ubuntu-24.04\tmp\oxc-tests'
            viteplus: '\\wsl.localhost\Ubuntu-24.04\var\tmp\oxc-viteplus'
            packagemanagers: '\\wsl.localhost\Ubuntu-24.04\var\tmp\oxc-package-managers'
    env:
      OXC_TEST_WSL_DISTRO: Ubuntu-24.04
      OXC_TEST_WSL_NODE: /usr/local/bin/node
      OXC_TEST_TMPDIR: ${{ matrix.tmpdir }}
      OXC_TEST_VITEPLUS_FIXTURE: ${{ matrix.viteplus }}
      OXC_TEST_PACKAGE_MANAGER_FIXTURES: ${{ matrix.packagemanagers }}
    steps:
      - name: Fetch Sources
        uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: ${{ env.JAVA_TOOLCHAIN_DISTRO }}
          java-version: ${{ env.JAVA_TOOLCHAIN_VERSION }}

      # Restores the cache that the `test-windows` job writes.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Setup WSL
        uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        with:
          distribution: ${{ env.OXC_TEST_WSL_DISTRO }}
          # The Node.js binary from nodejs.org needs libatomic1, which the distribution doesn't include.
          additional-packages: curl libatomic1 xz-utils
          use-cache: ${{ env.CACHE_READ_ONLY != 'true' }}

      # The distribution's own package is too old for Oxlint.
      - name: Setup Node in WSL
        shell: wsl-bash {0}
        run: |
          version="$(tr -d '\r' < .node-version)"
          curl -fsSL "https://nodejs.org/dist/v${version}/node-v${version}-linux-x64.tar.xz" \
            | tar -xJ -C /usr/local --strip-components=1

      # Run inside WSL so that the Linux binaries are installed.
      - name: Setup Oxlint Highlighting No Config Test
        shell: wsl-bash {0}
        working-directory: src/test/testData/oxlint/highlighting/no-config
        run: npm ci

      - name: Setup Oxfmt Formatting Test
        shell: wsl-bash {0}
        working-directory: src/test/testData/oxfmt/formatting/nested-config
        run: npm ci

      - name: Setup Vite+ Test
        if: ${{ matrix.viteplus == '' }}
        shell: wsl-bash {0}
        working-directory: src/test/testData/viteplus/project
        run: npm ci

      # A project in WSL needs the fixture in WSL too. /tmp is cleared when WSL restarts the distribution.
      - name: Setup Vite+ Test in WSL
        if: ${{ matrix.viteplus != '' }}
        shell: wsl-bash {0}
        working-directory: src/test/testData/viteplus/project
        run: |
          mkdir -p /var/tmp/oxc-viteplus
          cp package.json package-lock.json vite.config.ts index.js /var/tmp/oxc-viteplus/
          cd /var/tmp/oxc-viteplus && npm ci

      - name: Setup npm Workspace Test
        if: ${{ matrix.packagemanagers == '' }}
        shell: wsl-bash {0}
        working-directory: src/test/testData/package-managers/npm
        run: npm ci

      - name: Setup Yarn Workspace Test
        if: ${{ matrix.packagemanagers == '' }}
        shell: wsl-bash {0}
        working-directory: src/test/testData/package-managers/yarn
        run: node .yarn/releases/yarn-4.18.1.cjs install --immutable

      - name: Setup pnpm Workspace Test
        if: ${{ matrix.packagemanagers == '' }}
        shell: wsl-bash {0}
        working-directory: src/test/testData/package-managers/pnpm
        run: npx -y pnpm@12.18.0 install --frozen-lockfile

      # On a Windows drive, Bun links each package before extracting it, which seems to leave a link
      # Windows can't open as a folder. Linking again, once every folder exists, works around that.
      - name: Setup Bun Workspace Test
        if: ${{ matrix.packagemanagers == '' }}
        shell: wsl-bash {0}
        working-directory: src/test/testData/package-managers/bun
        run: |
          npx -y bun@1.3.14 install --frozen-lockfile
          find . -type l -path '*node_modules*' -print0 | while IFS= read -r -d '' link; do
            ln -sfn "$(readlink "$link")" "$link"
          done

      # Fails here rather than in the tests if Windows still can't follow the links that WSL made.
      - name: Check Linked Packages from Windows
        if: ${{ matrix.packagemanagers == '' }}
        shell: pwsh
        working-directory: src/test/testData/package-managers
        run: |
          $missing = foreach ($manager in 'bun', 'pnpm') {
            foreach ($package in 'node_modules/oxlint', 'packages/nested/node_modules/oxlint', 'packages/vite/node_modules/vite-plus') {
              $json = "$manager/$package/package.json"
              if (-not (Test-Path -LiteralPath $json -PathType Leaf)) { $json }
            }
          }
          if ($missing) { throw "Windows can't read through these links: $($missing -join ', ')" }

      # As for Vite+, a project in WSL needs the fixtures in WSL too.
      - name: Setup Package Manager Tests in WSL
        if: ${{ matrix.packagemanagers != '' }}
        shell: wsl-bash {0}
        working-directory: src/test/testData/package-managers
        run: |
          mkdir -p /var/tmp/oxc-package-managers
          tar --exclude=node_modules -cf - npm yarn pnpm bun | tar -xf - -C /var/tmp/oxc-package-managers
          cd /var/tmp/oxc-package-managers
          (cd npm && npm ci)
          (cd yarn && node .yarn/releases/yarn-4.18.1.cjs install --immutable)
          (cd pnpm && npx -y pnpm@12.18.0 install --frozen-lockfile)
          (cd bun && npx -y bun@1.3.14 install --frozen-lockfile)

      # In WSL, where the tests' vp runs and keeps its downloads.
      - name: Download Package Managers for Vite+
        shell: wsl-bash {0}
        run: node .github/scripts/download-vite-plus-package-managers.mjs ${{ matrix.packagemanagers != '' && '/var/tmp/oxc-package-managers' || 'src/test/testData/package-managers' }}

      - name: Create Project Folder in WSL
        if: ${{ matrix.tmpdir != '' }}
        shell: wsl-bash {0}
        run: mkdir -p /tmp/oxc-tests

      # Using Git Bash rewrites OXC_TEST_WSL_NODE into a Windows path which we want to avoid.
      - name: Run Tests
        shell: pwsh
        run: .\gradlew.bat test

      - name: Collect Tests Result
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-result-wsl-${{ matrix.project }}-project
          include-hidden-files: true
          path: |
            ${{ github.workspace }}/build/test-results/test
            ${{ github.workspace }}/build/reports/tests
            ${{ github.workspace }}/.intellijPlatform/sandbox/*/*/log-test/language-services
            ${{ github.workspace }}/.intellijPlatform/sandbox/*/*/log-test/failed-tests

  build:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch Sources
        uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: ${{ env.JAVA_TOOLCHAIN_DISTRO }}
          java-version: ${{ env.JAVA_TOOLCHAIN_VERSION }}

      # Restores the cache that the `test` job writes.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Build and Sign Plugin
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew signPlugin

      - name: Upload Plugin Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin
          path: ./build/distributions/*.zip

      - name: Run Plugin Verification
        run: ./gradlew verifyPlugin

      - name: Collect Plugin Verifier Result
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pluginVerifier-result
          path: ${{ github.workspace }}/build/reports/pluginVerifier
